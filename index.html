    <style>
      @keyframes calvras-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes calvras-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.98); }
      }
      .calvras-init-loader {
        position: fixed;
        inset: 0;
        background-color: #1c1c1c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .calvras-init-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #2e2e2e;
        border-top-color: #ff5e28;
        animation: calvras-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .calvras-init-text {
        font-size: 13px;
        font-weight: 600;
        color: #e4e4e7;
        letter-spacing: -0.01em;
        animation: calvras-pulse 1.5s ease-in-out infinite;
      }
    </style>
